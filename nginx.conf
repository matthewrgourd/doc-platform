server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # A location with its own add_header drops these, so the static assets
    # block repeats them. HSTS belongs on the TLS-terminating proxy.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-WJOct5vEUCm/OV1uqP93SArBzeywkWbgpLxasUIrx+A=' 'sha256-ba4RNVMZbnzJ+bbEeCl1KN1RZYpnTDHkn4DOmtwhl6k=' 'sha256-u1TYnaoQNoeq1d62kw0BdDbZiBJKcbfH/S7+IAQdcwQ=' 'sha256-MQlw1epr25pQQb9bKBc8HnqC/7desKeyLYCxqHV2hqY=' 'sha256-gDSv+JwxQ6JyQViZIaD2tm54PpvZ+zm0MGe4aFSsnAU=' 'sha256-iziFwht6BmfBbW4MwDMO8p3EodHXSvCYyQrsm/v19NQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.scalar.com; connect-src 'self' https://*.algolia.net https://*.algolianet.com https://insights.algolia.io https://chat.devdocify.com https://petstore3.swagger.io https://api.tfl.gov.uk https://api.escuelajs.co; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /stub_status {
        stub_status;
        access_log off;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-WJOct5vEUCm/OV1uqP93SArBzeywkWbgpLxasUIrx+A=' 'sha256-ba4RNVMZbnzJ+bbEeCl1KN1RZYpnTDHkn4DOmtwhl6k=' 'sha256-u1TYnaoQNoeq1d62kw0BdDbZiBJKcbfH/S7+IAQdcwQ=' 'sha256-MQlw1epr25pQQb9bKBc8HnqC/7desKeyLYCxqHV2hqY=' 'sha256-gDSv+JwxQ6JyQViZIaD2tm54PpvZ+zm0MGe4aFSsnAU=' 'sha256-iziFwht6BmfBbW4MwDMO8p3EodHXSvCYyQrsm/v19NQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.scalar.com; connect-src 'self' https://*.algolia.net https://*.algolianet.com https://insights.algolia.io https://chat.devdocify.com https://petstore3.swagger.io https://api.tfl.gov.uk https://api.escuelajs.co; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
