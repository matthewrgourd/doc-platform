name: Supabase keepalive

# Free Supabase projects pause after 7 days without activity. This reads one
# row from public.keepalive so the request reaches Postgres, not just the API
# gateway. Mon and Thu keeps the longest gap at 4 days.
#
# Required secrets: SUPABASE_URL, SUPABASE_ANON_KEY (anon or publishable key)

on:
  schedule:
    - cron: '0 8 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Query keepalive table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set"
            exit 1
          fi
          body=$(curl -sS --max-time 30 -w '\n%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          status=$(echo "$body" | tail -n1)
          echo "Response status: $status"
          echo "$body" | head -n1
          if [ "$status" != "200" ]; then
            echo "::error::Keepalive query failed with status $status"
            exit 1
          fi
