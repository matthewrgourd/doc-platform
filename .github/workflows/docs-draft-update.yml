name: Docs draft update

# Triggered by chat-devdocify when a monitored change is merged to its main
# branch. Creates a draft PR in doc-platform for human review. Never publishes
# content directly. Auto-approval is not permitted.
#
# Required secret: DOCS_DRAFT_TOKEN
#   Fine-grained PAT scoped to this repo with contents:write and
#   pull-requests:write. Falls back to GITHUB_TOKEN for testing (may lack PR
#   creation permissions in fork scenarios).
#
# Monitored paths in chat-devdocify:
#   src/prompt/   → system prompt changes → assistant docs
#   src/routes/   → endpoint changes      → API contract docs
#   src/safety/   → safety policy changes → quality policy docs
#   src/config/   → config schema changes → configuration reference

on:
  repository_dispatch:
    types: [chat-devdocify-change]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Simulated source commit SHA (for manual testing)
        required: false
        default: 'manual-test'
      commit_message:
        description: Simulated commit message
        required: false
        default: 'Manual test dispatch'
      changed_files:
        description: JSON array of changed file paths
        required: false
        default: '["src/prompt/system.ts"]'
      doc_sections:
        description: JSON array of affected doc slugs
        required: false
        default: '["devdocify/explanation/assistant"]'

# Payload fields are attacker-influenced (commit messages are author-controlled).
# They reach scripts only through env vars, never through ${{ }} inside run:.
permissions: {}

jobs:
  create-draft-pr:
    name: Create docs draft PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      EVENT_NAME: ${{ github.event_name }}
      ACTOR: ${{ github.actor }}
      RUN_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.run_id || format('manual-{0}', github.run_id) }}
      COMMIT_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.commit_sha || github.event.inputs.commit_sha }}
      COMMIT_MESSAGE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.commit_message || github.event.inputs.commit_message }}
      CHANGED_FILES: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload.changed_files) || github.event.inputs.changed_files }}
      DOC_SECTIONS: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload.doc_sections) || github.event.inputs.doc_sections }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.DOCS_DRAFT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Validate inputs and render draft
        id: draft
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          sha = os.environ.get("COMMIT_SHA", "")
          # manual-test is the workflow_dispatch default
          if not (re.fullmatch(r"[0-9a-f]{7,40}", sha) or sha == "manual-test"):
              fail("commit_sha must be 7-40 lowercase hex characters")

          run_id = os.environ.get("RUN_ID", "")
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,100}", run_id):
              fail("run_id contains unexpected characters")

          # One line, no table breakers, capped length
          raw_msg = os.environ.get("COMMIT_MESSAGE", "").splitlines()
          msg = raw_msg[0] if raw_msg else ""
          msg = re.sub(r"[|`<>\r]", "", msg)[:200]

          def parse_list(name):
              try:
                  items = json.loads(os.environ.get(name) or "[]")
              except json.JSONDecodeError:
                  fail(f"{name} is not valid JSON")
              if not isinstance(items, list) or not all(isinstance(i, str) for i in items):
                  fail(f"{name} must be a JSON array of strings")
              clean = [re.sub(r"[^A-Za-z0-9._/@ -]", "", i)[:200] for i in items[:100]]
              return clean

          files = parse_list("CHANGED_FILES")
          sections = parse_list("DOC_SECTIONS")
          files_md = "\n".join(f"- `{i}`" for i in files) or "- (none)"
          sections_md = "\n".join(f"- `{i}`" for i in sections) or "- (none)"

          branch = f"docs-draft/chat-devdocify-{sha}"
          draft_path = f"docs/devdocify/explanation/pending-updates/draft-{sha}.md"

          draft = f"""---
          draft: true
          review_required: true
          source_repo: chat-devdocify
          source_commit: {sha}
          source_run: {run_id}
          generated_by: docs-draft-update workflow
          ---

          # Draft: Pending documentation update

          > **This file is a machine-generated draft. It must not be merged as-is.**
          > A human reviewer must verify, edit, and approve this content before merge.
          > Auto-approval is not permitted.

          ## Source change summary

          | Field | Value |
          |---|---|
          | Source repo | `chat-devdocify` |
          | Commit | `{sha}` |
          | Commit message | {msg} |
          | Workflow run | `{run_id}` |

          ## Changed files

          {{files_md}}

          ## Affected documentation sections

          {{sections_md}}

          ## Reviewer instructions

          1. Review the changed files in `chat-devdocify` at commit `{sha}`.
          2. Identify which documentation sections are stale or incorrect.
          3. Edit the affected doc pages directly (do not publish this draft file).
          4. Remove this draft file before merging.
          5. Ensure the build passes (`npm run build`): broken links will fail CI.

          If this draft is not actionable, close the PR with a rationale comment.
          If regeneration is needed, re-trigger the `chat-devdocify-change` dispatch.
          """
          # Strip the YAML block indent, then insert the multi-line lists
          draft = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in draft.splitlines()) + "\n"
          draft = draft.replace("{files_md}", files_md).replace("{sections_md}", sections_md)

          os.makedirs(os.path.dirname(draft_path), exist_ok=True)
          with open(draft_path, "w") as f:
              f.write(draft)

          tmp = os.environ["RUNNER_TEMP"]
          with open(f"{tmp}/commit-msg.txt", "w") as f:
              f.write(
                  f"docs(draft): pending update from chat-devdocify@{sha}\n\n"
                  f"trigger: {os.environ['EVENT_NAME']} / chat-devdocify-change\n"
                  f"source-run: {run_id}\n"
                  f"source-commit: {sha}\n"
                  f"actor: {os.environ['ACTOR']}\n"
                  f"changed-files: {json.dumps(files)}\n"
                  f"doc-sections: {json.dumps(sections)}\n"
                  "review-required: true\n"
                  "auto-approval: blocked\n"
              )

          body = f"""## Automated docs draft: human approval required

          > **Auto-approval is not permitted.** This PR must be reviewed and approved by a human before merge.

          A change was merged to `chat-devdocify` that may affect documentation in this repo.
          This draft PR was created automatically to surface the impact for human review.

          ### Source change

          | Field | Value |
          |---|---|
          | Source repo | `chat-devdocify` |
          | Commit | `{sha}` |
          | Commit message | {msg} |
          | Workflow run | `{run_id}` |

          ### Changed files in chat-devdocify

          {{files_md}}

          ### Affected documentation sections

          {{sections_md}}

          ### Reviewer checklist

          - [ ] Reviewed source commit `{sha}` in `chat-devdocify`
          - [ ] Identified stale or incorrect documentation sections
          - [ ] Updated affected doc pages (not the draft file)
          - [ ] Removed the draft file before merge
          - [ ] Verified `npm run build` passes (broken links fail CI)
          - [ ] Approved this PR (auto-approval is blocked)

          ### If this draft is not actionable

          Close this PR with a rationale comment. To regenerate, re-trigger the
          `chat-devdocify-change` repository dispatch from `chat-devdocify`.
          """
          body = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in body.splitlines()) + "\n"
          body = body.replace("{files_md}", files_md).replace("{sections_md}", sections_md)
          with open(f"{tmp}/pr-body.md", "w") as f:
              f.write(body)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"sha={sha}\nbranch={branch}\ndraft_path={draft_path}\n")
          PYEOF

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push draft branch
        env:
          BRANCH: ${{ steps.draft.outputs.branch }}
          DRAFT_PATH: ${{ steps.draft.outputs.draft_path }}
        run: |
          git checkout -b "$BRANCH"
          git add -- "$DRAFT_PATH"
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          git push origin "$BRANCH"

      - name: Create draft PR
        env:
          GH_TOKEN: ${{ secrets.DOCS_DRAFT_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.draft.outputs.branch }}
          SHA: ${{ steps.draft.outputs.sha }}
        run: |
          gh pr create \
            --draft \
            --title "docs(draft): pending update from chat-devdocify@${SHA}" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --base main \
            --head "$BRANCH"

      - name: Emit audit log
        env:
          BRANCH: ${{ steps.draft.outputs.branch }}
          SHA: ${{ steps.draft.outputs.sha }}
        run: |
          echo "::notice title=Docs draft PR created::branch=${BRANCH} source-commit=${SHA} trigger=${EVENT_NAME} actor=${ACTOR}"
