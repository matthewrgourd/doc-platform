name: RBAC permission check

# Runs on push to main before the deploy jobs in ci.yml.
# Verifies that the actor pushing to main has the content.publish capability.
#
# If rbac.config.json is absent (e.g. in forks or initial setup), the example
# config is used as a fallback so CI does not fail unexpectedly.
# In production, rbac.config.json should be provided as a repository secret
# or environment file and written during the checkout step.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rbac-check:
    name: RBAC — verify publish permission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Use example RBAC config if no real config present
        run: |
          if [ ! -f rbac.config.json ]; then
            echo "[rbac-check] No rbac.config.json found — using example config (CI fallback)"
            cp rbac.config.example.json rbac.config.json
          fi

      - name: Check publish permission for ${{ github.actor }}
        run: |
          npx tsx scripts/check-rbac-permission.ts \
            --actor "${{ github.actor }}" \
            --capability content.publish \
            --config rbac.config.json
