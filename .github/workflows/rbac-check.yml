name: RBAC permission check

# Runs on push to main. Verifies that the actor pushing to main has the
# content.publish capability according to rbac.config.json.
#
# If rbac.config.json is absent the check is skipped (exit 0). The example
# config is a documentation template, not a real config, and must not be used
# for enforcement. Provide a real rbac.config.json via a repository secret or
# environment file to activate enforcement.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rbac-check:
    name: "RBAC: verify publish permission"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check publish permission
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ ! -f rbac.config.json ]; then
            echo "[rbac-check] No rbac.config.json: skipping (no real config present)"
            exit 0
          fi
          npx tsx scripts/check-rbac-permission.ts \
            --actor "$ACTOR" \
            --capability content.publish \
            --config rbac.config.json
