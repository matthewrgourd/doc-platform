version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Security updates for npm come from the repo setting; these are version bumps.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Docusaurus fails to build when its packages are on different versions,
      # and React must stay on a version Docusaurus supports.
      docusaurus:
        patterns: ['@docusaurus/*', 'react', 'react-dom', '@types/react', '@types/react-dom']
    ignore:
      # Types track the Node major we run (24), not the newest one.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
